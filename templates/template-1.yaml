id: study-jwt-none
info:
  name: "Bypassing JWT Authentication"
  author: "HackerAcademy_Seed"
  severity: high
  description: "1. The \"Broken Auth\" Lab (ID: study-jwt-none)\nLearning Objective: Understand how improper JWT library configuration allows an attacker to bypass authentication by changing the header algorithm to none."

environment:
  docker: "hackeracademy/labs-node-jwt:latest"
  setup: "docker run -p 8080:8080 hackeracademy/labs-node-jwt"

scenario:
  mission: "Access the protected /admin/flag endpoint without a valid password."
  steps:
    - "Login as a guest user to receive a JWT."
    - "Decode the JWT and change the 'alg' field to 'none'."
    - "Remove the signature and send the modified token back to the server."

validation:
  type: flag
  flag_id: "ACADEMY{n0ne_is_n0t_a_saf3_alg}"
