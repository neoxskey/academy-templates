# Placeholder for template-3.yaml
# The "Insecure Direct Object Reference" (ID: study-idor-order)
​Learning Objective: Learn how incrementing a numeric ID in a URL (e.g., /order/101) can expose other users' private data.
# Add your .study YAML here
id: study-idor-order
info:
  name: "IDOR: Stealing Order Data"
  severity: medium

environment:
  docker: "hackeracademy/labs-php-orders:v2"

scenario:
  mission: "Find the shipping address of user 'admin' by browsing your own order history."
  steps:
    - "Place an order for a sandwich."
    - "Observe the URL: /orders/view?id=502."
    - "Iterate through IDs to find a different user's receipt."

validation:
  type: flag
  flag_id: "ACADEMY{id_is_not_auth}"
